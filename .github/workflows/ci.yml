name: ci

# Build, test, and package on every push / PR.  This is a **standalone**
# ggml_backend repo, so the whole source tree is the project; no path
# filter needed.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-cpu
            cmake_extra: ""
          - os: macos-latest        # Apple-Silicon runner → Metal enabled by default
            name: macos-arm64-metal
            cmake_extra: ""
          - os: windows-latest
            name: windows-x64-cpu
            cmake_extra: ""

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reference-dump Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy gguf pyyaml

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DGAME_GGML_BUILD_TESTS=ON \
                ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build -j --config Release

      # Only the checkpoint-free reference-dump categories run on CI; tests
      # that need GAME-pt-1.0-small/ gracefully GTEST_SKIP if the dumps are
      # absent.
      - name: Generate reference dumps
        run: |
          python scripts/dump_reference.py --category basic --out tests/data
          python scripts/dump_reference.py --category ffn   --out tests/data
          python scripts/dump_reference.py --category rope  --out tests/data

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: CLI smoke test
        run: |
          ls build/bin
          build/bin/game_ggml_cli* --version || true

      - name: Collect artifacts
        run: |
          set -e
          pkg="game_ggml-${{ matrix.name }}"
          mkdir -p "$pkg"
          cp README.md "$pkg/" || true
          cp LICENSE   "$pkg/" || true
          find build/bin -maxdepth 2 -type f \
               \( -name "game_ggml_cli*" -o -name "libggml*" -o -name "ggml*.dll" \
                  -o -name "default.metallib" \) \
               -exec cp {} "$pkg/" \;
          find build/lib -maxdepth 2 -type f \
               -name "libgame_ggml*" -exec cp {} "$pkg/" \;
          ls -la "$pkg/"
          echo "PKG_DIR=$pkg" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_DIR }}
          path: ${{ env.PKG_DIR }}
          if-no-files-found: error
          retention-days: 30

  # On `v*` tags, bundle every per-platform artifact into a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per-platform bundles
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done
          cd ..
          ls -la *.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          fail_on_unmatched_files: true
